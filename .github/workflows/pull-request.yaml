name: Pull Request
on:
  pull_request:
    branches:
      - main

jobs:
  pr-check:
    name: PR Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Code quality and tests (parallel)
        run: |
          pnpm code-quality:check &
          pnpm test &
          wait
